<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClinicFlow — Admin Login</title>
<link rel="stylesheet" href="adminlogin.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark">+</span>
      <span class="brand-name">ClinicFlow</span>
    </div>
    <span class="brand-tag">ADMIN</span>

    <h1>Sign in to Admin</h1>
    <p class="sub">Restricted access — administrators only.</p>

    <div id="errorBanner" class="error-banner" hidden></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@clinicflow.app" required autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login" id="loginBtn">Sign in</button>
    </form>

    <p class="footnote">Not an admin? Return to the <a href="../../Auth/login/login.html">patient / doctor login</a>.</p>
  </div>
</div>

<script src="adminlogin.js"></script>
</body>
</html>
